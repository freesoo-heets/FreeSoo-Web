<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/site.css" />
<script src="site-config.js"></script>
<script src="assets/site.js"></script>
<style>html:not(.member-ready) body{visibility:hidden}</style>
  <title>FreeSoo 무공 설명서</title>
  <meta name="description" content="직업별 무공 설명서와 영상 미리보기를 제공하는 페이지" />
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html">
      <div class="brand-mark">秀</div>
      <div class="brand-copy">
        <strong>FreeSoo 비공식 포털</strong>
        <span>공지 · 공략집 · 무공 · 다운로드 · 문의</span>
      </div>
    </a>
    <button class="menu-toggle" id="menuToggle" type="button">☰ 메뉴</button>
    <nav class="nav" id="mainNav">
      <a href="index.html" data-nav="home">홈</a>
      <a href="index.html#news" data-nav="news">공지</a>
      <a href="guide-select.html" data-nav="guides">공략집</a>
      <a href="skills.html" data-nav="skills">무공</a>
      <a href="index.html#download" data-nav="download">다운로드</a>
      <a href="index.html#contact" data-nav="contact">문의</a>
    </nav>
  </div>
</header>
  <div class="wrap member-nav"><div id="memberActions" class="member-actions"></div></div>
  <main class="section">
    <div class="wrap">
      <div class="hero-panel">
        <div class="eyebrow">NEO PORTAL · SKILL LIBRARY</div>
        <h1>무공 설명서</h1>
        <p>직업과 무공을 검색하고 영상을 확인하세요. 연결된 영상은 1:1 화면에 크게 표시되며, 미등록 영상은 준비 중으로 안내합니다.</p>
        <div class="skills-toolbar">
          <input id="q" class="input" type="search" aria-label="무공 검색" placeholder="무공명 · 설명 · 태그 검색" />
          <select id="jobFilter" class="select" aria-label="직업별 필터"><option value="">전체 직업</option></select>
          <select id="videoFilter" class="select" aria-label="영상 연결 상태"><option value="">전체 영상 상태</option><option value="linked">영상 연결됨</option><option value="pending">영상 미연결</option></select>
        </div>
        <p class="media-summary" id="mediaSummary" role="status">영상 연결 현황을 확인 중입니다.</p>
        <div class="chip-row" style="margin-top: 12px;">
          <span class="chip">미디어 경로: <span id="cdnText"></span></span>
          <span class="chip">자동재생 꺼짐</span>
          <span class="chip">라이트박스 지원</span>
        </div>
      </div>
      <div class="section-head" style="margin-top: 16px;">
        <div><h2>무공 목록</h2><p class="count" id="countText">불러오는 중</p></div>
      </div>
      <div id="skillCards" class="skills-grid" aria-live="polite"><div class="empty">무공 정보를 불러오는 중입니다.</div></div>
    </div>
  </main>

  <div id="viewer" class="viewer">
    <div class="viewer-panel">
      <div class="viewer-head">
        <strong id="viewerTitle">무공 영상</strong>
        <button type="button" class="btn btn-secondary" id="viewerClose">닫기</button>
      </div>
      <video id="viewerVideo" controls preload="metadata" playsinline aria-label="무공 영상 확대 보기"></video>
    </div>
  </div>

  <script type="module">
    import {requireMember,fetchMemberContent} from './assets/member-auth.js';
    if(await requireMember()){
    Freesoo.initMenu('skills');
    const params = new URLSearchParams(location.search);
    const preselectedJob = params.get('job') || '';
    const viewer = document.getElementById('viewer');
    const viewerVideo = document.getElementById('viewerVideo');
    const viewerTitle = document.getElementById('viewerTitle');
    let jobs = [];

    document.getElementById('cdnText').textContent = window.FREESOO_CONFIG?.CDN_BASE || '사이트 상대 경로';

    function openViewer(src, title) {
      viewerTitle.textContent = title || '무공 영상';
      viewerVideo.src = src;
      viewer.classList.add('open');
      document.body.style.overflow = 'hidden';
      viewerVideo.play().catch(() => {});
    }
    function closeViewer() {
      viewerVideo.pause();
      viewerVideo.removeAttribute('src');
      viewerVideo.load();
      viewer.classList.remove('open');
      document.body.style.overflow = '';
    }
    document.getElementById('viewerClose').addEventListener('click', closeViewer);
    viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer(); });

    function createMediaMarkup(skill) {
      const rawVideo = typeof skill.video === 'string' ? skill.video.trim() : '';
      const rawThumb = typeof skill.thumbnail === 'string' ? skill.thumbnail.trim() : '';
      // Only present playable controls for explicitly linked files.
      // Legacy filename conventions remain available to administrators for migration.
      if (!rawVideo) return '<div class="video-pending" role="status"><span>VIDEO PENDING</span><strong>영상 준비 중</strong><small>무공 설명은 정상적으로 이용할 수 있습니다.</small></div>';
      const videoPath = Freesoo.resolveMedia(rawVideo);
      const poster = rawThumb ? '<img class="video-poster" src="' + Freesoo.esc(Freesoo.resolveMedia(rawThumb)) + '" alt="' + Freesoo.esc(skill.name) + ' 썸네일" loading="lazy">' : '';
      return `
        <div class="media-wrap" data-video="${Freesoo.esc(videoPath)}" data-title="${Freesoo.esc(skill.name)}">
          <div class="video-shell">
            ${poster}
            <div class="video-overlay" role="button" tabindex="0" aria-label="${Freesoo.esc(skill.name)} 영상 재생"><div class="play-badge"></div></div>
          </div>
          <div class="video-fallback muted hidden" role="status">영상 파일을 불러올 수 없습니다. 관리자에서 경로를 확인해주세요.</div>
        </div>
      `;
    }

    function loadCardVideo(mediaWrap) {
      if (!mediaWrap || mediaWrap.dataset.loaded === '1' || mediaWrap.dataset.loading === '1') return;
      mediaWrap.dataset.loading = '1';
      const videoSrc = mediaWrap.dataset.video;
      const title = mediaWrap.dataset.title || '무공 영상';
      const shell = mediaWrap.querySelector('.video-shell');
      const poster = mediaWrap.querySelector('.video-poster');
      const overlay = mediaWrap.querySelector('.video-overlay');
      const fallback = mediaWrap.querySelector('.video-fallback');
      const video = document.createElement('video');
      video.className = 'skill-video';
      video.controls = true;
      video.preload = 'metadata';
      video.playsInline = true;
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', () => {
        mediaWrap.dataset.loaded = '1';
        delete mediaWrap.dataset.loading;
        if (poster) poster.style.display = 'none';
        if (overlay) overlay.style.display = 'none';
      }, { once: true });
      video.addEventListener('error', () => {
        if (poster) poster.style.display = 'none';
        if (overlay) overlay.style.display = 'none';
        video.remove();
        delete mediaWrap.dataset.loading;
        fallback?.classList.remove('hidden');
      }, { once: true });
      video.addEventListener('dblclick', () => openViewer(videoSrc, title));
      shell.prepend(video);
      video.play().catch(() => {});
    }

    function bindMediaEvents() {
      document.querySelectorAll('.media-wrap').forEach(mediaWrap => {
        const poster = mediaWrap.querySelector('.video-poster');
        const overlay = mediaWrap.querySelector('.video-overlay');
        poster?.addEventListener('error', () => { poster.style.display = 'none'; }, { once: true });
        overlay?.addEventListener('click', () => loadCardVideo(mediaWrap));
        overlay?.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            loadCardVideo(mediaWrap);
          }
        });
      });
    }

    function renderSkills() {
      const keyword = (document.getElementById('q').value || '').trim().toLowerCase();
      const jobFilter = document.getElementById('jobFilter').value;
      const videoFilter = document.getElementById('videoFilter').value;
      const merged = [];
      jobs.forEach(job => {
        (job.skills || []).forEach(skill => merged.push({ ...skill, jobId: job.id, jobName: job.name }));
      });
      const filtered = merged.filter(skill => {
        const haystack = [skill.name, skill.desc, (skill.tags || []).join(' '), skill.jobName].join(' ').toLowerCase();
        const linked = typeof skill.video === 'string' && skill.video.trim().length > 0;
        return (!keyword || haystack.includes(keyword)) &&
          (!jobFilter || skill.jobId === jobFilter) &&
          (!videoFilter || (videoFilter === 'linked' ? linked : !linked));
      });
      const linkedCount = merged.filter(s => typeof s.video === 'string' && s.video.trim()).length;
      document.getElementById('mediaSummary').textContent = `영상 URL 연결 ${linkedCount}개 / 전체 ${merged.length}개 · 미연결 ${merged.length - linkedCount}개`;
      document.getElementById('countText').textContent = `검색 결과 ${filtered.length}개`;
      document.getElementById('skillCards').innerHTML = filtered.length
        ? filtered.map(skill => `
            <article class="skill-card">
              <div class="badge">${Freesoo.esc(skill.jobName)}</div>
              <h3>${Freesoo.esc(skill.name)}</h3>
              <p class="muted">${Freesoo.esc(skill.desc || '')}</p>
              ${createMediaMarkup(skill)}
            </article>
          `).join('')
        : '<div class="empty">조건에 맞는 무공이 없습니다.</div>';
      bindMediaEvents();
    }

    fetchMemberContent('skills')
      .then(r => (typeof r.json === 'function' ? r.json() : r))
      .then(data => {
        jobs = data.jobs || [];
        const jobFilter = document.getElementById('jobFilter');
        jobs.forEach(job => {
          jobFilter.insertAdjacentHTML('beforeend', `<option value="${Freesoo.esc(job.id)}">${Freesoo.esc(job.name)}</option>`);
        });
        if (preselectedJob) jobFilter.value = preselectedJob;
        renderSkills();
      })
      .catch(() => {
        document.getElementById('countText').textContent = '데이터 로딩 실패';
        document.getElementById('skillCards').innerHTML = '<div class="empty">무공 정보를 불러오지 못했습니다. 새로고침하여 다시 시도해주세요.</div>';
      });

    ['q', 'jobFilter', 'videoFilter'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderSkills); 
      document.getElementById(id).addEventListener('change', renderSkills);
    });
    }
  </script>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeSoo 마이페이지</title><link rel="stylesheet" href="assets/site.css"><style>html:not(.member-ready) body{visibility:hidden}.profile-panel{max-width:680px;margin:4vh auto}.profile-panel label{display:block;margin:13px 0}.profile-panel input{margin-top:6px}.profile-panel .controls{margin:18px 0}.profile-panel h2{margin-top:30px}</style></head><body><main class="wrap section"><section class="hero-panel profile-panel"><div class="eyebrow">NEO PORTAL · PROFILE</div><h1 style="font-size:clamp(2rem,5vw,2.8rem)">마이페이지</h1><p id="identity"></p><h2>프로필 정보</h2><label>게임 닉네임<input id="nickname" class="input" minlength="2" maxlength="24"></label><label>휴대전화번호<input id="phone" class="input" type="tel" inputmode="numeric"></label><p class="muted">전화번호 변경 후에도 SMS 본인확인이 완료된 것으로 처리되지 않습니다.</p><div class="controls"><button id="save" class="btn btn-primary">정보 변경</button><a href="index.html" class="btn btn-secondary">홈으로</a></div><h2>계정 보안</h2><div class="controls"><button id="reset" class="btn btn-secondary">비밀번호 재설정 이메일 발송</button></div><p id="status" role="status"></p></section></main><script type="module">import {authClient,requireMember} from './assets/member-auth.js';const $=id=>document.getElementById(id);if(await requireMember()){const {data:{user}}=await authClient.auth.getUser();$('identity').textContent=user.email;const {data,error}=await authClient.from('member_profiles').select('game_nickname,phone_number').eq('user_id',user.id).maybeSingle();if(error)$('status').textContent=error.message;if(data){$('nickname').value=data.game_nickname;$('phone').value=data.phone_number;}else $('status').textContent='기존 회원의 프로필 정보가 없습니다. 입력 후 저장하세요.';$('save').onclick=async()=>{const name=$('nickname').value.trim(),phone=$('phone').value.replace(/[^0-9]/g,'');if(name.length<2||name.length>24||!/^01[016789][0-9]{7,8}$/.test(phone)){$('status').textContent='닉네임(2~24자)과 전화번호 형식을 확인하세요.';return;}const {error}=await authClient.from('member_profiles').upsert({user_id:user.id,game_nickname:name,phone_number:phone},{onConflict:'user_id'});$('status').textContent=error?error.message:'프로필 저장 완료';};$('reset').onclick=async()=>{const {error}=await authClient.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+'/reset-password.html'});$('status').textContent=error?error.message:'비밀번호 재설정 메일을 확인해주세요.';};}</script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeSoo · Neo Portal 관리자</title><link rel="stylesheet" href="assets/site.css">
<style>.admin-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}.admin-layout nav{display:grid;align-content:start;gap:8px}.admin-layout textarea{width:100%;min-height:380px;background:#1c130e;color:#f7ead9;border:1px solid #946138;border-radius:12px;padding:16px;font:13px/1.6 monospace}.admin-layout input{width:100%;padding:12px;border:1px solid #946138;border-radius:12px;background:#1c130e;color:white}.admin-layout button{max-width:100%}@media(max-width:760px){.admin-layout{grid-template-columns:1fr}.admin-layout nav{grid-template-columns:repeat(3,minmax(0,1fr))}.admin-layout nav button{min-width:0;padding:8px}}</style>
</head><body><main class="wrap section"><div class="eyebrow">NEO PORTAL · CONSOLE</div><h1>FreeSoo 통합 관리자</h1><p class="muted">Supabase Auth · Database · Storage / Vercel</p><section id="login" class="hero-panel"><h2>관리자 로그인</h2><label>이메일<input id="email" type="email" autocomplete="username" class="input"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" class="input"></label><button id="signIn" class="btn btn-primary">로그인</button><p id="loginStatus" role="status"></p></section>
<section id="panel" class="hidden"><div class="controls"><button id="signOut" class="btn btn-secondary">로그아웃</button><a href="index.html" class="btn btn-secondary">홈으로</a></div>
<div class="admin-layout"><nav aria-label="콘텐츠 선택"><button data-section="notices" class="btn btn-secondary">공지·이벤트</button><button data-section="guides" class="btn btn-secondary">공략집</button><button data-section="skills" class="btn btn-secondary">무공</button></nav>
<div class="hero-panel"><h2 id="sectionTitle">공지·이벤트</h2><p>콘텐츠를 JSON 형식으로 편집합니다. 저장 전 자동으로 브라우저 백업이 생성됩니다.</p>
<textarea id="editor" spellcheck="false" aria-label="JSON 편집기"></textarea><p id="status" role="status"></p>
<div class="controls"><button id="validate" class="btn btn-secondary">JSON 검사</button><button id="checkConnection" class="btn btn-secondary">연결 점검</button><button id="backup" class="btn btn-secondary">JSON 백업</button><button id="save" class="btn btn-primary">Supabase 저장</button></div>
<hr><h3>미디어 업로드</h3><input id="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm">
<button id="upload" class="btn btn-secondary">Supabase Storage 업로드</button><p id="mediaResult" class="muted"></p>
</div></div></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id);
const status=(msg)=>{$('status').textContent=msg};
let client,user,section='notices',loaded=null;
try {const r=await fetch('/api/config');const cfg=await r.json();if(!r.ok)throw Error(cfg.error||'설정 오류');client=createClient(cfg.url,cfg.anonKey);const {data}=await client.auth.getUser();if(data.user)await enter(data.user);}catch(err){$('loginStatus').textContent=err.message;}
async function enter(u){const {data,error}=await client.from('site_admins').select('user_id').eq('user_id',u.id).maybeSingle();if(error||!data){await client.auth.signOut();throw Error('관리자 권한이 없습니다.');}user=u;$('login').classList.add('hidden');$('panel').classList.remove('hidden');await load(section);}
$('signIn').onclick=async()=>{try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await enter(data.user);$('loginStatus').textContent='';}catch(err){$('loginStatus').textContent=err.message;}};
$('signOut').onclick=async()=>{await client.auth.signOut();location.reload()};
async function load(s){section=s;status('불러오는 중...');const {data,error}=await client.from('site_content').select('payload,updated_at').eq('section',s).single();if(error)throw error;loaded=data;$('editor').value=JSON.stringify(data.payload,null,2);$('sectionTitle').textContent={notices:'공지·이벤트',guides:'공략집',skills:'무공'}[s];status('불러오기 완료 · '+data.updated_at);}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{if(loaded&&$('editor').value!==JSON.stringify(loaded.payload,null,2)&&!confirm('저장하지 않은 변경을 버리고 이동할까요?'))return;load(b.dataset.section).catch(e=>status(e.message))});
function parse(){const value=JSON.parse($('editor').value);if(!value||typeof value!=='object')throw Error('JSON 객체 또는 배열이 필요합니다.');if(section==='guides'&&!Array.isArray(value))throw Error('공략집은 배열이어야 합니다.');if(section==='notices'&&(!Array.isArray(value.notices)||!Array.isArray(value.events)))throw Error('공지 형식 오류');if(section==='skills'&&!Array.isArray(value.jobs))throw Error('무공 형식 오류');if(loaded){const baseline=section==='guides'?loaded.payload.length:section==='skills'?loaded.payload.jobs.length:(loaded.payload.notices?.length||0)+(loaded.payload.events?.length||0);const next=section==='guides'?value.length:section==='skills'?value.jobs.length:(value.notices?.length||0)+(value.events?.length||0);if(baseline>0&&next===0)throw Error('모든 기존 콘텐츠가 사라지는 저장은 차단됩니다.');}return value;}
$('validate').onclick=()=>{try{parse();status('JSON 형식 정상');}catch(e){status(e.message)}};
function download(text,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
$('checkConnection').onclick=async()=>{try{const {data:userResult,error:authError}=await client.auth.getUser();if(authError||!userResult.user)throw Error('로그인 세션 확인 실패');const [contents,bucket]=await Promise.all([client.from('site_content').select('section'),client.storage.from('freesoo-media').list('',{limit:1})]);if(contents.error)throw contents.error;if(bucket.error)throw bucket.error;status('인증·콘텐츠 읽기·Storage 파일 목록 접근 정상 (저장/업로드 미수행)');}catch(e){status('연결 점검 실패: '+e.message)}};
$('backup').onclick=()=>download($('editor').value,section+'-backup-'+new Date().toISOString().slice(0,10)+'.json');
$('save').onclick=async()=>{try{const payload=parse();if(!confirm('기존 '+section+' 데이터가 교체됩니다. 진행할까요?'))return;download(JSON.stringify(loaded.payload,null,2),section+'-before-save.json');const {data:latest,error:checkError}=await client.from('site_content').select('updated_at').eq('section',section).single();if(checkError)throw checkError;if(latest.updated_at!==loaded.updated_at)throw Error('다른 관리자가 변경했습니다. 다시 불러온 후 병합하세요.');const {error}=await client.from('site_content').update({payload,updated_at:new Date().toISOString(),updated_by:user.id}).eq('section',section).eq('updated_at',loaded.updated_at).select().single();if(error)throw error;await load(section);status('Supabase 저장 완료');}catch(e){status('저장 실패: '+e.message)}};
$('upload').onclick=async()=>{const file=$('media').files?.[0];if(!file)return;const allowed=['image/jpeg','image/png','image/webp','video/mp4','video/webm'];if(!allowed.includes(file.type)||file.size>50*1024*1024){$('mediaResult').textContent='허용 타입 또는 50MB 크기를 확인하세요.';return;}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path='uploads/'+crypto.randomUUID()+'-'+safe;const {error}=await client.storage.from('freesoo-media').upload(path,file,{upsert:false,contentType:file.type});if(error){$('mediaResult').textContent=error.message;return;}const {data}=client.storage.from('freesoo-media').getPublicUrl(path);$('mediaResult').textContent='업로드 완료: ';const a=document.createElement('a');a.href=data.publicUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='미디어 열기';$('mediaResult').append(a);};
</script></body></html>

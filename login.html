<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeSoo 회원 로그인</title><link rel="stylesheet" href="assets/site.css"><style>.auth-shell{max-width:480px;margin:7vh auto}.auth-shell label{display:block;margin:14px 0}.auth-shell label input{margin-top:7px}.auth-shell .controls{margin-top:20px}.auth-shell .controls button{flex:1}.auth-shell p{line-height:1.7}</style></head><body><main class="wrap section"><div class="auth-shell"><div class="hero-panel"><div class="eyebrow">NEO PORTAL · MEMBER ACCESS</div><h1>FreeSoo 로그인</h1><p>회원 로그인 후 공략집과 무공 영상을 이용할 수 있습니다.</p><form id="authForm"><label>이메일<input required id="email" class="input" type="email" autocomplete="email"></label><label>비밀번호<input required id="password" class="input" type="password" autocomplete="current-password" minlength="8"></label><div class="controls"><button id="signin" class="btn btn-primary" type="submit">로그인</button><button id="signup" class="btn btn-secondary" type="button">회원가입</button></div></form><p id="authStatus" role="status" aria-live="polite"></p><a href="index.html">홈으로 돌아가기 ↗</a></div></div></main><script type="module">import {authClient} from './assets/member-auth.js';const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next')||'index.html';const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'index.html';const {data:{user}}=await authClient.auth.getUser();if(user)location.replace(safeNext);$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authStatus').textContent='로그인 확인 중...';const {error}=await authClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?error.message:'로그인 성공';if(!error)location.replace(safeNext);});$('signup').addEventListener('click',async()=>{const {error,data}=await authClient.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?error.message:(data.session?'회원가입이 완료되었습니다.':'가입 확인 이메일을 확인해주세요.');if(data.session)location.replace(safeNext);});</script></body></html>

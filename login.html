<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeSoo 회원 로그인</title><link rel="stylesheet" href="assets/site.css"><style>.auth-shell{max-width:480px;margin:7vh auto}.auth-shell label{display:block;margin:14px 0}.auth-shell label input{margin-top:7px}.auth-shell .controls{margin-top:20px}.auth-shell .controls button{flex:1}.auth-shell p{line-height:1.7} .auth-title{font-size:clamp(1.9rem,5vw,2.65rem);line-height:1.2;letter-spacing:-.055em;word-break:keep-all;overflow-wrap:normal;margin:18px 0 14px;font-weight:800}.auth-title span{white-space:nowrap}.auth-shell .hero-panel{padding:clamp(22px,5vw,38px)}@media(max-width:420px){.auth-title{font-size:clamp(1.75rem,7.5vw,2.15rem)}.auth-title span{display:inline}}  .auth-consent{display:flex!important;align-items:center;gap:8px;font-size:.82rem;line-height:1.55}.auth-consent input{width:16px;height:16px;flex:0 0 16px}.auth-shell .controls{flex-wrap:wrap} </style></head><body><main class="wrap section"><div class="auth-shell"><div class="hero-panel"><div class="eyebrow">NEO PORTAL · MEMBER ACCESS</div><h1 class="auth-title">FreeSoo <span>로그인</span></h1><p>회원 로그인 후 공략집과 무공 영상을 이용할 수 있습니다.</p><form id="authForm"><label>이메일<input required id="email" class="input" type="email" autocomplete="email"></label><label>비밀번호<input required id="password" class="input" type="password" autocomplete="current-password" minlength="8"></label><div id="signupFields" hidden><label>비밀번호 확인<input id="confirmPassword" class="input" type="password" autocomplete="new-password" minlength="8"></label><label>게임 닉네임<input id="gameNickname" class="input" type="text" minlength="2" maxlength="24" autocomplete="nickname" placeholder="2~24자"></label><label>휴대전화번호<input id="phoneNumber" class="input" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678"></label><label class="auth-consent"><input id="agreeTerms" type="checkbox"> <a href="privacy.html" target="_blank" rel="noopener noreferrer" style="color:#bdf35b;text-decoration:underline">개인정보 처리방침 확인</a> 및 이메일·게임 닉네임·휴대전화번호의 회원가입 목적 처리에 동의합니다. (SMS 본인인증은 아직 제공되지 않습니다.)</label></div><div class="controls"><button id="signin" class="btn btn-primary" type="submit">로그인</button><button id="signup" class="btn btn-secondary" type="button">회원가입</button></div></form><p id="authStatus" role="status" aria-live="polite"></p><a href="index.html">홈으로 돌아가기 ↗</a></div></div></main><script type="module">import {authClient} from './assets/member-auth.js';const $=id=>document.getElementById(id);const next=new URLSearchParams(location.search).get('next')||'index.html';const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'index.html';$('forgotPassword').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authStatus').textContent='이메일을 먼저 입력해주세요.';return;}const {error}=await authClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});$('authStatus').textContent=error?error.message:'비밀번호 재설정 이메일을 확인해주세요.';};const {data:{user}}=await authClient.auth.getUser();if(user)location.replace(safeNext);$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authStatus').textContent='로그인 확인 중...';const {error}=await authClient.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?error.message:'로그인 성공';if(!error)location.replace(safeNext);});$('signup').addEventListener('click',async()=>{if($('signupFields').hidden){$('signupFields').hidden=false;$('confirmPassword').required=true;$('gameNickname').required=true;$('phoneNumber').required=true;$('authStatus').textContent='비밀번호 확인과 개인정보 처리 동의를 확인해주세요.';return;}if($('password').value.length<8){$('authStatus').textContent='비밀번호는 8자 이상이어야 합니다.';return;}if($('password').value!==$('confirmPassword').value){$('authStatus').textContent='비밀번호가 일치하지 않습니다.';return;}if(!$('agreeTerms').checked){$('authStatus').textContent='가입을 위해 개인정보 처리 동의가 필요합니다.';return;}const nickname=$('gameNickname').value.trim();const phone=$('phoneNumber').value.replace(/[^0-9]/g,'');if(nickname.length<2||nickname.length>24){$('authStatus').textContent='게임 닉네임은 2~24자로 입력해주세요.';return;}if(!/^01[016789][0-9]{7,8}$/.test(phone)){$('authStatus').textContent='올바른 휴대전화번호를 입력해주세요.';return;}const {error,data}=await authClient.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{game_nickname:nickname,phone_number:phone}}});$('authStatus').textContent=error?error.message:(data.session?'회원가입이 완료되었습니다.':'가입 확인 이메일을 확인해주세요. 휴대전화번호는 입력 정보이며 SMS 본인인증은 아직 진행되지 않습니다.');if(data.session)location.replace(safeNext);});</script></body></html>

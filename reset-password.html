<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeSoo 비밀번호 재설정</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="wrap section"><div class="hero-panel" style="max-width:480px;margin:7vh auto"><div class="eyebrow">ACCOUNT SECURITY</div><h1 style="font-size:2rem">비밀번호 변경</h1><p id="recoveryState" class="muted" role="status">재설정 링크 인증을 확인 중입니다.</p><label>새 비밀번호<input class="input" type="password" minlength="8" id="password"></label><label>새 비밀번호 확인<input class="input" type="password" minlength="8" id="confirmPassword"></label><button class="btn btn-primary" id="save">변경하기</button><p role="status" id="message"></p></div></main><script type="module">
import {authClient} from './assets/member-auth.js';
const $=id=>document.getElementById(id);
let authorized=false;
const {data:{session}}=await authClient.auth.getSession();
if(session){authorized=true;$('recoveryState').textContent='계정 세션 확인 완료. 새 비밀번호를 입력하세요.';}
else $('recoveryState').textContent='유효한 재설정 링크로 접속해주세요.';
authClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){authorized=true;$('recoveryState').textContent='재설정 인증이 완료되었습니다.';}});
$('save').onclick=async()=>{if(!authorized){$('message').textContent='재설정 이메일의 링크에서 다시 접속해주세요.';return;}const pw=$('password').value;if(pw.length<8||pw!==$('confirmPassword').value){$('message').textContent='8자 이상 비밀번호와 확인값이 일치해야 합니다.';return;}const {error}=await authClient.auth.updateUser({password:pw});$('message').textContent=error?error.message:'비밀번호 변경 완료. 다시 로그인해주세요.';if(!error){await authClient.auth.signOut();$('save').disabled=true;}};
</script></body></html>

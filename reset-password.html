<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeSoo 비밀번호 재설정</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="wrap section"><div class="hero-panel" style="max-width:480px;margin:7vh auto"><div class="eyebrow">ACCOUNT SECURITY</div><h1 style="font-size:2rem">비밀번호 변경</h1><label>새 비밀번호<input class="input" type="password" minlength="8" id="password"></label><button class="btn btn-primary" id="save">변경하기</button><p role="status" id="message"></p></div></main><script type="module">import {authClient} from './assets/member-auth.js';document.getElementById('save').onclick=async()=>{const pw=document.getElementById('password').value;if(pw.length<8){document.getElementById('message').textContent='8자 이상 입력하세요.';return;}const {error}=await authClient.auth.updateUser({password:pw});document.getElementById('message').textContent=error?error.message:'변경되었습니다. 로그인 화면으로 돌아가세요.';};</script></body></html>
